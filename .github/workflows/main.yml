name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Loyiha papkasini topish
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            for z in *.zip; do
              [ -f "$z" ] && unzip -oq "$z"
            done
            S=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$S" ]; then
            echo "settings.gradle topilmadi. Repozitoriy tarkibi:"
            find . -not -path './.git/*' | head -n 60
            exit 1
          fi
          echo "Topildi: $S"
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Litsenziyalarni qabul qilish
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: APK yig'ish
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: raqamlar-debug-apk
          path: "**/build/outputs/apk/debug/*.apk" 
